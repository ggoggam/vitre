[versions]
agp = "9.2.1"
kotlin = "2.3.10"
composeMultiplatform = "1.10.1"
material3 = "1.10.0-alpha05"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.12.4"
androidx-lifecycle = "2.9.6"
androidx-webkit = "1.15.0"
coroutines = "1.10.2"
kcef = "2024.04.20.4"
koog = "1.1.1"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
serialization = "1.9.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }

# Kotlin CEF Browser: an embedded Chromium for the desktop target. Brings `dev.datlag:jcef`
# (the Java bindings) transitively; the native Chromium bundle is downloaded at first run.
#
# Deliberately not the newest KCEF. 2025.03.23 unpacks a current JetBrains Runtime bundle into a
# layout its own initialiser then cannot find, and the app dies with a SIGSEGV inside JCEF's
# `FindClass` before a window appears. This is the version compose-webview-multiplatform ships,
# and it is paired with a pinned runtime release in sample/desktopApp — the two go together.
kcef = { module = "dev.datlag:kcef", version.ref = "kcef" }

# Koog, JetBrains' Kotlin agent framework. `agents-core` rather than the `koog-agents` umbrella:
# the umbrella pulls every LLM client and both A2A transports, and this module needs the tool
# contract plus the agent pipeline a feature installs into, and nothing else. A host picks its own
# prompt executor and brings the client that goes with it.
koog-agents-core = { module = "ai.koog:agents-core", version.ref = "koog" }
# Koog's own test doubles. Used only by the on-device end-to-end test, which needs a prompt executor
# that emits a scripted sequence of tool calls: the point of that test is the agent loop and the
# WebView underneath it, not the model.
koog-agents-test = { module = "ai.koog:agents-test", version.ref = "koog" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

[plugins]
android-application   = { id = "com.android.application",                   version.ref = "agp" }
android-kmp-library   = { id = "com.android.kotlin.multiplatform.library",  version.ref = "agp" }
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                     version.ref = "composeMultiplatform" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
