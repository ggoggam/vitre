[versions]
agp = "9.2.1"
kotlin = "2.3.10"
composeMultiplatform = "1.10.1"
material3 = "1.10.0-alpha05"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.12.4"
androidx-lifecycle = "2.9.6"
androidx-webkit = "1.15.0"
coroutines = "1.10.2"
# The JCEF the desktop target compiles against, and the JetBrains Runtime it runs on. The two are one
# setting: the jar is only the Java API, and the Chromium behind it is whatever the runtime carries,
# so the jar has to be the API that runtime actually has. The version names do not say which
# runtime that is — `api-1.20` is shared by builds whose signatures differ (the `-261-` ones replace
# `CefApp.getInstance(String[], CefSettings)`, which JBR 21 has and CefRuntime calls). This is the
# IntelliJ 253 build, the line JBR 21 ships with, and its public API matches the `jcef` module in
# JBR 21.0.10 everywhere this library touches. Bumping `jbr` means re-checking that with `javap`.
jcef = "137.0.17-gf354b0e-chromium-137.0.7151.104-api-1.20-253-b13"
jbr = "21"
koog = "1.1.1"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
serialization = "1.9.0"
mavenPublish = "0.33.0"
dokka = "2.2.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }

# JCEF's Java API, for compiling the desktop target and nothing else. The implementation — the `jcef`
# module and the Chromium it loads — ships inside the JetBrains Runtime (`jbr_jcef`), which is what a
# desktop host runs on, so this jar is `compileOnly` everywhere and never reaches a POM. At runtime
# the module in the JDK's boot layer owns the `org.cef` packages and a copy on the classpath would be
# ignored anyway. Published by JetBrains to their own repository rather than Maven Central; see the
# scoped `maven(...)` in settings.gradle.kts.
jcef = { module = "org.jetbrains.intellij.deps.jcef:jcef", version.ref = "jcef" }

# Koog, JetBrains' Kotlin agent framework. `agents-core` rather than the `koog-agents` umbrella:
# the umbrella pulls every LLM client and both A2A transports, and this module needs the tool
# contract plus the agent pipeline a feature installs into, and nothing else. A host picks its own
# prompt executor and brings the client that goes with it.
koog-agents-core = { module = "ai.koog:agents-core", version.ref = "koog" }
# Koog's own test doubles. Used only by the on-device end-to-end test, which needs a prompt executor
# that emits a scripted sequence of tool calls: the point of that test is the agent loop and the
# WebView underneath it, not the model.
koog-agents-test = { module = "ai.koog:agents-test", version.ref = "koog" }
# The one LLM client in the build, and it is test-only on purpose: `vitre-koog` ships no client so
# that a host picks its own, and the live test in vitre-koog/src/jvmTest is what checks that the
# tool descriptors this module generates are ones a real provider accepts and a real model can use.
koog-prompt-executor-anthropic = { module = "ai.koog:prompt-executor-anthropic-client", version.ref = "koog" }
# Koog resolves its HTTP transport through a service-loader lookup, so a client artifact on its own
# gets you `No KoogHttpClient.Factory provider found` at the first request rather than a compile
# error. A host that adds a Koog LLM client needs this — or another Factory provider — alongside it.
koog-http-client-ktor = { module = "ai.koog:http-client-ktor", version.ref = "koog" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

[plugins]
android-application   = { id = "com.android.application",                   version.ref = "agp" }
android-kmp-library   = { id = "com.android.kotlin.multiplatform.library",  version.ref = "agp" }
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                     version.ref = "composeMultiplatform" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
# Publishing. The Central Portal API, the KMP publication layout (a root module plus one per
# target), signing and the javadoc jar are all things this plugin already knows; hand-rolling
# them on `maven-publish` is a few hundred lines that go stale the next time Central changes.
maven-publish         = { id = "com.vanniktech.maven.publish",              version.ref = "mavenPublish" }
# Applied only so the publish plugin finds it: with `org.jetbrains.dokka` present it wires
# `dokkaGeneratePublicationHtml` into the javadoc jar Central requires, instead of shipping the
# empty stub it falls back to. Nothing in the build calls a Dokka task by hand.
dokka                 = { id = "org.jetbrains.dokka",                       version.ref = "dokka" }
