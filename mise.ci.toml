# CI-runner-only tools for vitre. Merged over mise.toml when MISE_ENV=ci, which the CI
# workflow sets — so nothing here lands in a local `mise install`.
[tools]
# Gradle (the `test` task) and ktlint need a JDK; vitre targets JVM <= 17. Hosted
# ubuntu-latest preinstalls one, but not necessarily the version the build asks for, so it is
# pinned exactly here rather than left to whatever the image ships.
java = "temurin-17"
